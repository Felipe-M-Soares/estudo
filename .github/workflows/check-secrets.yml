name: Checagem de segredos

# Roda em todo push e pull request. Se algum segredo real (chave do
# Supabase, token do Mercado Pago, o arquivo .env) acabar versionado, o
# workflow falha e bloqueia o merge - uma segunda camada de protecao alem
# do .gitignore e do "npm run check-secrets" local.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo (com historico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rodar checagem de segredos
        run: node scripts/check-secrets.mjs
